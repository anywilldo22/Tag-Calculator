<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal TAG & Insulin Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-xl mx-auto bg-slate-800 rounded-xl shadow-xl p-6 border border-slate-700">
    
    <header class="mb-6 border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-cyan-400">TAG & Bolus Calculator</h1>
      <p class="text-sm text-slate-400">Total Available Glucose & 50/50 Split Dosing</p>
    </header>

    <!-- SETTINGS (LOCKED BY DEFAULT) -->
    <section class="mb-6 bg-slate-900/50 p-4 rounded-lg border border-slate-700/60">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-cyan-300 uppercase tracking-wider">Personal Settings</h2>
        <button id="toggleSettingsBtn" onclick="toggleSettingsLock()" class="text-xs bg-slate-700 hover:bg-slate-600 text-cyan-300 px-3 py-1 rounded transition border border-cyan-500/30">
          🔒 Unlock to Edit
        </button>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Insulin : TAG</label>
          <div class="flex items-center">
            <span class="text-xs mr-1 text-slate-500">1:</span>
            <input type="number" id="ratio" value="40" disabled class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-center text-white text-base opacity-60 cursor-not-allowed transition">
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">ISF (mg/dL)</label>
          <input type="number" id="isf" value="50" disabled class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-center text-white text-base opacity-60 cursor-not-allowed transition">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Target BG</label>
          <input type="number" id="targetBg" value="120" disabled class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-center text-white text-base opacity-60 cursor-not-allowed transition">
        </div>
      </div>
    </section>

    <!-- CURRENT BG -->
    <section class="mb-6">
      <label class="block text-xs font-semibold text-cyan-300 uppercase tracking-wider mb-2">Current Blood Glucose (mg/dL)</label>
      <input type="number" id="currentBg" placeholder="e.g. 136" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xl text-white focus:outline-none focus:border-cyan-400">
    </section>

    <!-- MACROS -->
    <section class="grid grid-cols-3 gap-3 mb-6">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Carbs (g)</label>
        <input type="number" id="carbs" value="0" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-center text-white text-lg">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Fat (g)</label>
        <input type="number" id="fat" value="0" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-center text-white text-lg">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Protein (g)</label>
        <input type="number" id="protein" value="0" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-center text-white text-lg">
      </div>
    </section>

    <!-- RESULTS PANEL -->
    <section class="bg-slate-900/80 p-4 rounded-lg border border-slate-700">
      <h2 class="text-xs font-semibold text-cyan-300 uppercase tracking-wider mb-3">Calculation Results</h2>
      
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <span class="text-xs text-slate-400">Total TAG:</span>
          <p id="totalTag" class="text-xl font-bold text-white">0.00g</p>
        </div>
        <div>
          <span class="text-xs text-slate-400">Correction Dose:</span>
          <p id="correctionDose" class="text-xl font-bold text-amber-400">+0.00 u</p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 pt-3 border-t border-slate-800 mb-4">
        <div>
          <span class="text-xs text-slate-400">Meal Dose:</span>
          <p id="mealDose" class="text-xl font-bold text-white">0.00 u</p>
        </div>
        <div>
          <span class="text-xs text-slate-400">Total Combined Dose:</span>
          <p id="totalDose" class="text-2xl font-bold text-cyan-400">0.00 u</p>
        </div>
      </div>

      <!-- 50/50 SPLIT BOX -->
      <div class="bg-slate-800/80 p-3 rounded border border-slate-700/80">
        <h3 class="text-xs font-semibold text-cyan-300 uppercase tracking-wider mb-2">50/50 Split Recommendation</h3>
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="bg-slate-900/60 p-2 rounded">
            <span class="block text-[10px] text-slate-400">1st Dose (Upfront):</span>
            <span id="dose1" class="text-lg font-bold text-emerald-400">0.00 u</span>
          </div>
          <div class="bg-slate-900/60 p-2 rounded">
            <span class="block text-[10px] text-slate-400">2nd Dose (1.5 - 3h later):</span>
            <span id="dose2" class="text-lg font-bold text-emerald-400">0.00 u</span>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    let settingsUnlocked = false;

    function toggleSettingsLock() {
      const btn = document.getElementById('toggleSettingsBtn');
      const inputs = ['ratio', 'isf', 'targetBg'];

      if (!settingsUnlocked) {
        if (confirm("Are you sure you want to unlock and edit your personal settings (ISF, Target BG, Ratio)?")) {
          settingsUnlocked = true;
          btn.innerHTML = "🔓 Lock Settings";
          btn.classList.remove('bg-slate-700', 'text-cyan-300');
          btn.classList.add('bg-amber-600', 'text-white');
          inputs.forEach(id => {
            const el = document.getElementById(id);
            el.disabled = false;
            el.classList.remove('opacity-60', 'cursor-not-allowed');
            el.classList.add('border-amber-400');
          });
        }
      } else {
        settingsUnlocked = false;
        btn.innerHTML = "🔒 Unlock to Edit";
        btn.classList.remove('bg-amber-600', 'text-white');
        btn.classList.add('bg-slate-700', 'text-cyan-300');
        inputs.forEach(id => {
          const el = document.getElementById(id);
          el.disabled = true;
          el.classList.add('opacity-60', 'cursor-not-allowed');
          el.classList.remove('border-amber-400');
        });
      }
    }

    function calculate() {
      const ratio = parseFloat(document.getElementById('ratio').value) || 0;
      const isf = parseFloat(document.getElementById('isf').value) || 0;
      const targetBg = parseFloat(document.getElementById('targetBg').value) || 0;

      const currentBg = parseFloat(document.getElementById('currentBg').value) || 0;
      const carbs = parseFloat(document.getElementById('carbs').value) || 0;
      const fat = parseFloat(document.getElementById('fat').value) || 0;
      const protein = parseFloat(document.getElementById('protein').value) || 0;

      const totalTag = (carbs * 1.0) + (protein * 0.58) + (fat * 0.10);

      let correctionDose = 0;
      if (currentBg > 0 && targetBg > 0 && isf > 0) {
        if (currentBg > targetBg) {
          correctionDose = (currentBg - targetBg) / isf;
        }
      }

      let mealDose = 0;
      if (ratio > 0) {
        mealDose = totalTag / ratio;
      }

      const totalDose = mealDose + correctionDose;
      const splitDose = totalDose / 2;

      document.getElementById('totalTag').innerText = totalTag.toFixed(2) + 'g';
      document.getElementById('correctionDose').innerText = (correctionDose >= 0 ? '+' : '') + correctionDose.toFixed(2) + ' u';
      document.getElementById('mealDose').innerText = mealDose.toFixed(2) + ' u';
      document.getElementById('totalDose').innerText = totalDose.toFixed(2) + ' u';

      document.getElementById('dose1').innerText = splitDose.toFixed(2) + ' u';
      document.getElementById('dose2').innerText = splitDose.toFixed(2) + ' u';
    }

    const inputs = ['ratio', 'isf', 'targetBg', 'currentBg', 'carbs', 'fat', 'protein'];
    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', calculate);
    });
  </script>
</body>
</html>
