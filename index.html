<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal TAG & Insulin Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-xl mx-auto bg-slate-800 rounded-xl shadow-xl p-6 border border-slate-700">
        
        <header class="mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold text-cyan-400">TAG & Bolus Calculator</h1>
            <p class="text-sm text-slate-400">Total Available Glucose & 50/50 Split Dosing</p>
        </header>

        <!-- SETTINGS -->
        <section class="mb-6 bg-slate-900/50 p-4 rounded-lg border border-slate-700/60">
            <h2 class="text-sm font-semibold text-cyan-300 uppercase tracking-wider mb-3">Personal Settings</h2>
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Insulin : TAG</label>
                    <div class="flex items-center">
                        <span class="text-xs mr-1 text-slate-500">1:</span>
                        <input type="number" id="ratio" value="40" oninput="calculateDose()" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-center font-mono focus:border-cyan-400 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">ISF (mg/dL)</label>
                    <input type="number" id="isf" value="50" oninput="calculateDose()" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-center font-mono focus:border-cyan-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Target BG</label>
                    <input type="number" id="targetBg" value="120" oninput="calculateDose()" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-center font-mono focus:border-cyan-400 focus:outline-none">
                </div>
            </div>
        </section>

        <!-- INPUTS -->
        <section class="space-y-4 mb-6">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Current Blood Glucose (mg/dL)</label>
                <input type="number" id="currentBg" placeholder="e.g. 136" oninput="calculateDose()" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-lg font-mono text-cyan-200 focus:border-cyan-400 focus:outline-none">
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Carbs (g)</label>
                    <input type="number" id="carbs" value="0" step="0.1" oninput="calculateDose()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 font-mono focus:border-cyan-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Fat (g)</label>
                    <input type="number" id="fat" value="0" step="0.1" oninput="calculateDose()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 font-mono focus:border-cyan-400 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Protein (g)</label>
                    <input type="number" id="protein" value="0" step="0.1" oninput="calculateDose()" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 font-mono focus:border-cyan-400 focus:outline-none">
                </div>
            </div>
        </section>

        <!-- RESULTS (ALWAYS VISIBLE & UPDATES LIVE) -->
        <div id="results" class="space-y-4 bg-slate-900 p-5 rounded-lg border border-cyan-500/30">
            <h2 class="text-sm font-semibold text-cyan-400 uppercase tracking-wider border-b border-slate-800 pb-2">Calculation Results</h2>
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div>
                    <span class="text-slate-400 block text-xs">Total TAG:</span>
                    <span id="resTag" class="text-lg font-mono font-bold text-slate-200">0.00g</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-xs">Correction Dose:</span>
                    <span id="resCorrection" class="text-lg font-mono font-bold text-amber-400">+0.00 u</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-xs">Meal Dose:</span>
                    <span id="resMealDose" class="text-lg font-mono font-bold text-slate-200">0.00 u</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-xs">Total Combined Dose:</span>
                    <span id="resTotal" class="text-lg font-mono font-bold text-cyan-300">0.00 u</span>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-slate-800 bg-slate-800/40 p-4 rounded-lg">
                <h3 class="text-xs uppercase font-bold text-cyan-400 mb-2">50/50 Split Recommendation</h3>
                <div class="flex justify-between items-center text-sm">
                    <div>
                        <span class="text-slate-400 block text-xs">1st Dose (Upfront):</span>
                        <span id="resSplit1" class="font-mono font-bold text-lg text-emerald-400">0.00 u</span>
                    </div>
                    <div class="text-right">
                        <span class="text-slate-400 block text-xs">2nd Dose (1.5 - 3h later):</span>
                        <span id="resSplit2" class="font-mono font-bold text-lg text-emerald-400">0.00 u</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function calculateDose() {
            try {
                const ratio = parseFloat(document.getElementById('ratio').value) || 40;
                const isf = parseFloat(document.getElementById('isf').value) || 50;
                const targetBg = parseFloat(document.getElementById('targetBg').value) || 120;

                const currentBg = parseFloat(document.getElementById('currentBg').value);
                const carbs = parseFloat(document.getElementById('carbs').value) || 0;
                const fat = parseFloat(document.getElementById('fat').value) || 0;
                const protein = parseFloat(document.getElementById('protein').value) || 0;

                // TAG Calculation
                const totalTag = (carbs * 1.0) + (protein * 0.58) + (fat * 0.10);
                const mealDose = totalTag / ratio;

                // Correction Dose
                let correctionDose = 0;
                if (!isNaN(currentBg)) {
                    correctionDose = Math.max(0, (currentBg - targetBg) / isf);
                }

                const totalDose = mealDose + correctionDose;
                const halfDose = totalDose / 2.0;

                // Update UI text
                document.getElementById('resTag').innerText = totalTag.toFixed(2) + 'g';
                document.getElementById('resCorrection').innerText = '+' + correctionDose.toFixed(2) + ' u';
                document.getElementById('resMealDose').innerText = mealDose.toFixed(2) + ' u';
                document.getElementById('resTotal').innerText = totalDose.toFixed(2) + ' u';
                document.getElementById('resSplit1').innerText = halfDose.toFixed(2) + ' u';
                document.getElementById('resSplit2').innerText = halfDose.toFixed(2) + ' u';
            } catch (err) {
                console.error("Calculation error:", err);
            }
        }

        // Run calculation once on page load
        window.onload = calculateDose;
    </script>
</body>
</html>
